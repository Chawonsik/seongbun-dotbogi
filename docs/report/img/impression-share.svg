</style><rect width="100%" height="100%" rx="10" fill="#FFF8F3"/><title>광고별 노출 비중. 1차와 2차</title><desc>1차: 광고 세트 하나에 광고 둘 원료 그림 7%. 1차: 광고 세트 하나에 광고 둘 사용감 그림 93%. 2차: 광고 세트 둘에 예산 고정 성분 이름 문구 50.8%. 2차: 광고 세트 둘에 예산 고정 리뷰 언어 문구 49.2%.</desc><text class="vz-t" x="12.0" y="16.0" text-anchor="start" font-size="13">1차: 광고 세트 하나에 광고 둘</text><rect class="vz-a" data-w="25.03" x="12.0" y="26.0" width="25.0" height="22.0" rx="4"><title>1차: 광고 세트 하나에 광고 둘 원료 그림: 7%</title></rect><text class="vz-s" x="12.0" y="65.0" text-anchor="start" font-size="12">원료 그림 7%</text><rect class="vz-b" data-w="308.97" x="39.0" y="26.0" width="309.0" height="22.0" rx="4"><title>1차: 광고 세트 하나에 광고 둘 사용감 그림: 93%</title></rect><text class="vz-s" x="348.0" y="65.0" text-anchor="end" font-size="12">사용감 그림 93%</text><text class="vz-t" x="12.0" y="94.0" text-anchor="start" font-size="13">2차: 광고 세트 둘에 예산 고정</text><rect class="vz-a" data-w="169.65" x="12.0" y="104.0" width="169.6" height="22.0" rx="4"><title>2차: 광고 세트 둘에 예산 고정 성분 이름 문구: 50.8%</title></rect><text class="vz-s" x="12.0" y="143.0" text-anchor="start" font-size="12">성분 이름 문구 50.8%</text><rect class="vz-b" data-w="164.35" x="183.6" y="104.0" width="164.4" height="22.0" rx="4"><title>2차: 광고 세트 둘에 예산 고정 리뷰 언어 문구: 49.2%</title></rect><text class="vz-s" x="348.0" y="143.0" text-anchor="end" font-size="12">리뷰 언어 문구 49.2%</text></svg>